const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(err){alert('RepTrack could not save your data. Check browser storage and export a backup if possible.');return false}}function date(){return new Date().toLocaleDateString('en-CA')}function nav(){ $('nav').innerHTML=[['home','Home'],['workout','Workout'],['status','Status'],['walking','Walking'],['progress','Progress'],['settings','Edit']].map(([k,t])=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${t}</button>`).join('')}function go(p){page=p;render()}function render(){nav();updateAvatar();if(page==='profile')profilePage();if(page==='home')home();if(page==='workout')workout();if(page==='history')history();if(page==='status')playerStatus();if(page==='walking')walking();if(page==='progress')progress();if(page==='settings')settings()}
function latestWeight(){return [...data.weights].sort((a,b)=>a.day.localeCompare(b.day)).at(-1)?.kg}
function goalInfo(){let g=data.goal;if(!g||!Number.isFinite(+g.start)||!Number.isFinite(+g.target)||+g.start===+g.target)return null;let current=latestWeight(),start=+g.start,target=+g.target;let pct=current==null?0:Math.max(0,Math.min(100,(current-start)/(target-start)*100));return {start,target,current,pct,remaining:current==null?null:Math.abs(current-target)}}
function trainingGoals(){const target=Math.max(1,Math.min(7,Number(data.trainingGoals?.weekly)||4));const sessions=data.sessions.filter(s=>(s.sets||[]).some(x=>x.done));const weekStart=Date.now()-7*864e5;const week=sessions.filter(s=>new Date(s.at).getTime()>=weekStart).length;const improvements=strengthRecords().events.length;const strengthTarget=Math.max(1,Math.min(30,Number(data.trainingGoals?.strength)||5));const consistency=Math.min(100,100*week/target),strength=Math.min(100,100*improvements/strengthTarget);const goal=goalInfo();const weight=goal&&goal.current!=null?goal.pct:null;const composite=Math.round(.6*consistency+.4*strength);return {target,week,improvements,strengthTarget,consistency,strength,weight,composite,goal}}
function strengthRecords(){const events=[],byExercise=new Map(),best=new Map();const ordered=[...data.sessions].sort((a,b)=>new Date(a.at)-new Date(b.at));for(const session of ordered){const date=session.at;const sets=(session.sets||[]).filter(x=>x.done);const grouped=new Map();for(const set of sets){const name=String(set.exercise||'').trim(),key=name.toLowerCase(),kg=Number(set.kg),reps=Number(set.reps);if(!name||!Number.isFinite(kg)||kg<0||!Number.isFinite(reps)||reps<=0||/plank|hold|dead bug/i.test(name))continue;const item={name,key,kg,reps,at:date};if(!grouped.has(key))grouped.set(key,[]);grouped.get(key).push(item)}for(const [key,items] of grouped){const prev=best.get(key)||{maxKg:-1,repsByKg:new Map(),estimated:-1};const current=byExercise.get(key)||{name:items[0].name,points:[],records:[],maxKg:0,maxReps:0,maxEstimated:0};let pr=false;for(const x of items){const est=x.kg>0&&x.reps<=30?x.kg*(1+x.reps/30):0;const heavier=x.kg>prev.maxKg;const repPR=x.reps>(prev.repsByKg.get(x.kg)||0);const estimatedPR=est>prev.estimated+0.001;if(heavier||repPR){if(prev.maxKg>=0){current.records.push({...x,type:heavier?'Heaviest weight':'Rep record'});events.push({...x,type:heavier?'Heaviest weight':'Rep record'});pr=true}}prev.maxKg=Math.max(prev.maxKg,x.kg);prev.repsByKg.set(x.kg,Math.max(prev.repsByKg.get(x.kg)||0,x.reps));prev.estimated=Math.max(prev.estimated,est);current.maxKg=Math.max(current.maxKg,x.kg);current.maxReps=Math.max(current.maxReps,x.reps);current.maxEstimated=Math.max(current.maxEstimated,est)}const bestSet=items.reduce((a,b)=>b.kg*(1+b.reps/30)>a.kg*(1+a.reps/30)?b:a);current.points.push({at:date,kg:bestSet.kg,reps:bestSet.reps,estimate:bestSet.kg*(1+bestSet.reps/30),pr});best.set(key,prev);byExercise.set(key,current)}}return {events,byExercise}}
function strengthAchievements(){const n=strengthRecords().events.length;return [['FIRST BREAKTHROUGH',1],['FIVE BREAKTHROUGHS',5],['TEN BREAKTHROUGHS',10],['FIFTY BREAKTHROUGHS',50]].map(([name,target])=>({name,target,progress:n}))}

function drawStrengthChart(){const c=$('strengthChart');if(!c)return;const x=strengthRecords().byExercise.get(selectedStrength);if(!x)return;const ctx=c.getContext('2d'),pts=x.points;ctx.clearRect(0,0,c.width,c.height);const pad=35,w=c.width-pad-15,h=c.height-45;ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue('--line').trim();ctx.beginPath();ctx.moveTo(pad,12);ctx.lineTo(pad,12+h);ctx.lineTo(pad+w,12+h);ctx.stroke();const values=pts.map(p=>p.estimate),low=Math.max(0,Math.min(...values)-1),high=Math.max(...values)+1;const coords=values.map((v,i)=>({x:pad+(pts.length===1?w/2:w*i/(pts.length-1)),y:12+h-(v-low)/(high-low)*h}));ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue('--accent').trim();ctx.lineWidth=3;ctx.beginPath();coords.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();coords.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--accent').trim();ctx.fill()});ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--text').trim();ctx.font='13px sans-serif';ctx.fillText(high.toFixed(1),2,20);ctx.fillText(low.toFixed(1),2,12+h);ctx.fillText(`${pts.length} session${pts.length===1?'':'s'}`,pad+8,c.height-5)}

function removeRoutine(){if(Object.keys(data.routines).length<=1){alert('Keep at least one workout.');return}if(!confirm('Delete this workout routine? Saved workout history will remain.'))return;delete data.routines[routine];delete data.routineNames[routine];routine=Object.keys(data.routines)[0];draft=null;exerciseIndex=0;save();render()}
function startDraft(){if(draft&&draft.routine===routine)return;draft={routine,started:new Date().toISOString(),sets:data.routines[routine].flatMap((e,i)=>Array.from({length:e[1]},(_,j)=>{let prev=data.sessions.find(s=>s.routine===routine)?.sets.find(x=>x.exercise===e[0]&&x.index===j);return{exercise:e[0],index:j,reps:prev?.reps||'',kg:prev?.kg||'',done:false}}))};saveDraft()}
function repsOptions(value,seconds=false){let nums=seconds?Array.from({length:61},(_,i)=>i*5).filter(n=>n>0):Array.from({length:51},(_,i)=>i);let v=String(value??'');if(v&&!nums.includes(Number(v)))nums.push(Number(v));nums.sort((a,b)=>a-b);return `<option value="">—</option>`+nums.map(n=>`<option value="${n}" ${v===String(n)?'selected':''}>${n}</option>`).join('')}
function numberSelect(value,min,max,step,empty=false){let v=String(value??'');let nums=[];for(let i=0;i<=Math.round((max-min)/step);i++)nums.push(Number((min+i*step).toFixed(2)));if(v!==''&&Number.isFinite(+v)&&!nums.includes(+v))nums.push(+v);nums.sort((a,b)=>a-b);return (empty?'<option value="">Select</option>':'')+nums.map(n=>`<option value="${n}" ${v!==''&&+v===n?'selected':''}>${n}</option>`).join('')}
function targetOptions(value){let options=['5–8','6–10','8–10','8–12','8–12 / side','10–12','10–15','12–15','12–15 / arm','12–20','15–20','20–40 sec','30–45 sec','45–60 sec'];if(value&&!options.includes(value))options.unshift(value);return options.map(x=>`<option value="${esc(x)}" ${x===value?'selected':''}>${esc(x)}</option>`).join('')}
function restOptions(value){let opts=[0,15,30,45,60,75,90,120,150,180,240,300];if(!opts.includes(+value))opts.push(+value);opts.sort((a,b)=>a-b);return opts.map(n=>`<option value="${n}" ${+value===n?'selected':''}>${n===0?'Off':n+' sec'}</option>`).join('')}
function kgOptions(value){let nums=Array.from({length:81},(_,i)=>i*.5);let v=String(value??'');if(v!==''&&Number.isFinite(Number(v))&&!nums.includes(Number(v)))nums.push(Number(v));nums.sort((a,b)=>a-b);return `<option value="">—</option>`+nums.map(n=>`<option value="${n}" ${v!==''&&Number(v)===n?'selected':''}>${Number.isInteger(n)?n:n.toFixed(1)}</option>`).join('')}
function rankInfo(){return rankStatus().rank}
function previousPerformance(name){for(const session of data.sessions){const sets=(session.sets||[]).filter(x=>x.done&&x.exercise?.trim().toLowerCase()===name.trim().toLowerCase());if(sets.length)return {sets,at:session.at}}return null}
function performanceCard(name,isTimed){const last=previousPerformance(name);if(!last)return `<div class="last-performance"><span class="muted">No previous completed sets for this exercise yet.</span></div>`;const vals=last.sets.map(x=>({reps:Number(x.reps),kg:Number(x.kg)})).filter(x=>Number.isFinite(x.reps)&&x.reps>0);const summary=vals.map(x=>`${x.reps}${isTimed?'s':' reps'}${x.kg>0?' @ '+x.kg+' kg':''}`).join(' · ');let suggestion='Repeat your previous performance with comfortable technique.';if(!isTimed&&vals.length&&vals.every(x=>x.kg===vals[0].kg)&&!/(squat|lunge|step.up|knee)/i.test(name)){const best=Math.max(...vals.map(x=>x.reps));suggestion=`Optional target: try ${best+1} reps on one set at the same weight, only if form stays solid.`}return `<div class="last-performance"><small>LAST COMPLETED · ${new Date(last.at).toLocaleDateString()}</small><div><strong>${esc(summary||last.sets.length+' sets recorded')}</strong></div><p class="muted">${esc(suggestion)}</p></div>`}
function workout(){startDraft();let exercises=data.routines[routine];if(!exercises.length){$('view').innerHTML=`<h2>${esc(routineName(routine))}</h2><p>No exercises yet. Add exercises in Edit.</p><button onclick="go('settings')">Edit workout</button>${routineTabs('workout')}`;return}exerciseIndex=Math.min(exerciseIndex,exercises.length-1);let e=exercises[exerciseIndex],start=exercises.slice(0,exerciseIndex).reduce((a,x)=>a+x[1],0),isTimed=/plank|hold/i.test(e[0])||/sec/i.test(e[2]);let done=draft.sets.filter(s=>s.done).length,total=draft.sets.length,next=exercises[exerciseIndex+1];$('view').innerHTML=`<div class="system-kicker"><span class="system-dot"></span> ACTIVE SESSION</div><h2>Workout tracker</h2>${routineTabs('workout')}<div class="card"><div class="row"><span class="pill">Exercise ${exerciseIndex+1} of ${exercises.length}</span><span class="pill" id="count">${done}/${total} sets</span></div><div class="focus-progress"><div style="width:${total?done/total*100:0}%"></div></div><div class="exercise-heading"><h2 class="focus-title">${esc(e[0])}</h2>${EXERCISE_LIBRARY.some(x=>x[0].toLowerCase()===e[0].toLowerCase())?`<button class="exercise-help" onclick="showExerciseInfo()">ⓘ How to perform</button>`:""}</div><p class="muted">${e[1]} sets · ${esc(e[2])} ${isTimed?'seconds':'reps'}</p>${performanceCard(e[0],isTimed)}<div class="setrow"><small>Set</small><label>${isTimed?'Seconds':'Reps'}</label><label>Weight (kg)</label><label>Done</label></div>${Array.from({length:e[1]},(_,j)=>{let idx=start+j,s=draft.sets[idx];return `<div class="setrow"><small>${j+1}</small><select onchange="updateSet(${idx},'reps',this.value)" aria-label="${isTimed?'Seconds':'Reps'} set ${j+1}">${repsOptions(s.reps,isTimed)}</select><select onchange="updateSet(${idx},'kg',this.value)" aria-label="Weight in kilograms set ${j+1}">${kgOptions(s.kg)}</select><input class="set-check" type="checkbox" ${s.done?'checked':''} onchange="updateSet(${idx},'done',this.checked)" aria-label="Complete set ${j+1}"></div>`}).join('')}<div class="exercise-nav"><button ${exerciseIndex===0?'disabled':''} onclick="moveExercise(-1)">← Previous</button><button class="primary" ${exerciseIndex===exercises.length-1?'disabled':''} onclick="moveExercise(1)">Next exercise →</button></div><div class="next-card" aria-label="Up next: ${next?esc(next[0]):'Finish workout'}"><small>UP NEXT:</small><span class="next-summary"><b>${next?esc(next[0]):'Finish workout'}</b>${next?`<span class="next-detail"> · ${next[1]} × ${esc(next[2])}</span>`:''}</span></div><p><button class="primary" onclick="finish()">Finish & save</button> <button onclick="discard()">Reset</button></p></div>`;count()}
function moveExercise(delta){exerciseIndex=Math.max(0,Math.min(data.routines[routine].length-1,exerciseIndex+delta));saveDraft();workout();window.scrollTo(0,0)}
function count(){let el=$('count');if(el)el.textContent=`${draft.sets.filter(s=>s.done).length}/${draft.sets.length} sets`;let bar=document.querySelector('.focus-progress>div');if(bar)bar.style.width=`${draft.sets.length?draft.sets.filter(s=>s.done).length/draft.sets.length*100:0}%`};function updateSet(i,k,v){const was=draft.sets[i][k];draft.sets[i][k]=v;saveDraft();count();if(k==='done'&&v&&!was)startRest()}function switchRoutine(r){if(draft?.sets.some(s=>s.done)&&!confirm('Switching workouts will discard the current unsaved session. Continue?'))return;clearRest();routine=r;draft=null;exerciseIndex=0;saveDraft();render()}function discard(){if(!confirm('Discard this unsaved workout?'))return;clearRest();draft=null;exerciseIndex=0;saveDraft();render()}function finish(){if(!draft.sets.some(s=>s.done)){alert('Tick at least one completed set first.');return}let old=levelInfo().level,oldRank=rankStatus().rank[0];data.sessions.unshift({at:new Date().toISOString(),...draft,routineName:routineName(draft.routine)});if(!save()){data.sessions.shift();return}recordRank();clearRest();draft=null;saveDraft();page='history';render();let next=levelInfo().level,newRank=rankStatus().rank[0];notifySystem(newRank!==oldRank?'RANK ADVANCED':next>old?'LEVEL UP':'SESSION COMPLETE',newRank!==oldRank?`Rank ${newRank} unlocked`:next>old?`Level ${next} · +XP earned`:'Workout saved · XP earned')}
function history(){ $('view').innerHTML=`<h2>Workout history</h2>${data.sessions.length?data.sessions.map((s,i)=>`<div class="card"><div class="row"><b>${esc(s.routineName||routineName(s.routine))}</b><small>${new Date(s.at).toLocaleString()}</small></div><p>${s.sets.filter(x=>x.done).length} completed sets</p><details><summary>View sets</summary>${s.sets.filter(x=>x.done).map(x=>`<div class="exercise">${esc(x.exercise)} · ${esc(x.reps||'—')} reps/sec · ${esc(x.kg||'0')} kg</div>`).join('')}</details></div>`).join(''):'<div class="card">No workouts saved yet.</div>'}`}
const WALK_TIMER_KEY='reptrack-walk-start-v1';
let walkingStarted=Number(localStorage.getItem(WALK_TIMER_KEY))||0;
let walkingInterval=setInterval(()=>{if(page==='walking'&&walkingStarted)updateWalkingClock()},1000);
function walkTime(ms){const sec=Math.floor(Math.max(0,ms)/1000);return [Math.floor(sec/3600),Math.floor(sec%3600/60),sec%60].map(n=>String(n).padStart(2,'0')).join(':')}
function updateWalkingClock(){const el=$('walkingClock');if(el&&walkingStarted)el.textContent=walkTime(Date.now()-walkingStarted)}
function beginWalk(){if(walkingStarted)return;walkingStarted=Date.now();localStorage.setItem(WALK_TIMER_KEY,String(walkingStarted));walking()}
function endWalk(){if(!walkingStarted)return;const start=walkingStarted,elapsed=Date.now()-start;if(elapsed<10000){if(!confirm('This walk is under 10 seconds. End without saving?'))return;walkingStarted=0;localStorage.removeItem(WALK_TIMER_KEY);walking();return}const minutes=Math.max(1,Math.round(elapsed/60000));const day=new Date(start).toLocaleDateString('en-CA');data.walks.unshift({day,minutes,started:new Date(start).toISOString(),ended:new Date().toISOString(),durationSeconds:Math.round(elapsed/1000)});if(!save()){data.walks.shift();return}walkingStarted=0;localStorage.removeItem(WALK_TIMER_KEY);walking();notifySystem('WALK COMPLETE',`${minutes} minute${minutes===1?'':'s'} saved`)}
function cancelWalk(){if(!walkingStarted||!confirm('Discard this walking timer without saving?'))return;walkingStarted=0;localStorage.removeItem(WALK_TIMER_KEY);walking()}
function walking(){const walks=data.walks||[],total=walks.reduce((n,w)=>n+(Number(w.minutes)||0),0),week=walks.filter(w=>Date.now()-new Date(w.started||w.day+'T12:00:00').getTime()<7*864e5).reduce((n,w)=>n+(Number(w.minutes)||0),0);$('view').innerHTML=`<div class="system-kicker"><span class="system-dot"></span> ACTIVITY SYSTEM <span class="system-id">WALKING</span></div><h2>Walking</h2><div class="card walk-timer"><span class="pill">${walkingStarted?'WALK IN PROGRESS':'READY WHEN YOU ARE'}</span><div id="walkingClock" class="walk-clock">${walkTime(walkingStarted?Date.now()-walkingStarted:0)}</div><p class="muted">${walkingStarted?'Your timer will keep its start time if you lock your phone or leave this page.':'Press Start Walk when you head out. End Walk saves your duration automatically.'}</p>${walkingStarted?`<button class="primary" onclick="endWalk()">■ End walk & save</button><p><button onclick="cancelWalk()">Discard walk</button></p>`:`<button class="primary" onclick="beginWalk()">▶ Start walk</button>`}</div><div class="walk-summary"><div class="stat"><small>Walks</small><strong>${walks.length}</strong></div><div class="stat"><small>Total minutes</small><strong>${total}</strong></div><div class="stat"><small>Last 7 days</small><strong>${week}</strong></div></div><div class="card"><h3>Log a previous walk</h3><div class="row"><label>Date<input type="date" id="walkdate" value="${date()}"></label><label>Minutes<input type="number" id="walkmin" min="1" max="600" placeholder="20"></label></div><p><button onclick="addWalk()">Save manual walk</button></p></div><div class="card"><h3>Walking history</h3>${walks.slice(0,30).map(w=>`<div class="exercise">${esc(w.day)} · ${esc(w.minutes)} min ${w.started?'<span class="muted">· Timed</span>':'<span class="muted">· Manual</span>'}</div>`).join('')||'<p class="muted">No walks logged yet.</p>'}</div>${walkingAchievementHtml()}`}
function progress(){let weights=[...data.weights].sort((a,b)=>a.day.localeCompare(b.day));$('view').innerHTML=`<h2>Body & activity</h2><div class="card"><h3>Log body weight</h3><div class="row"><label>Date <input type="date" id="wdate" value="${date()}"></label><label>Weight (kg) <input type="number" min="20" max="400" step="0.1" id="wkg" placeholder="e.g. 94.0"></label></div><p><button class="primary" onclick="addWeight()">Save weigh-in</button></p><canvas id="weightChart" width="600" height="180" aria-label="Body weight chart"></canvas><p class="muted">${weights.length?weights.slice(-5).map(w=>`${esc(w.day)}: ${esc(w.kg)} kg`).join(' · '):'Add at least one weigh-in to start your chart.'}</p></div>${strengthPanel()}<div class="card"><h3>Walking</h3><p>Track walking time with the Start Walk timer or log past sessions manually.</p><button onclick="go('walking')">Open Walking →</button></div>`;chart(weights);drawStrengthChart()}function addWeight(){let kg=Number($('wkg').value),day=$('wdate').value;if(!day||kg<20||kg>400)return alert('Enter a valid date and weight.');let oldRank=rankStatus().rank[0];data.weights=data.weights.filter(w=>w.day!==day);data.weights.push({day,kg});save();recordRank();render();let newRank=rankStatus().rank[0];notifySystem(newRank!==oldRank?'RANK UPDATED':'WEIGH-IN SAVED',newRank!==oldRank?`Current rank: ${newRank}`:`${kg} kg recorded`)}function addWalk(){let minutes=Number($('walkmin').value),day=$('walkdate').value;if(!day||minutes<1||minutes>600)return alert('Enter a valid date and duration.');data.walks.unshift({day,minutes});save();render();notifySystem('WALK LOGGED',`${minutes} minutes recorded`)}
function chart(a){let c=$('weightChart'),ctx=c.getContext('2d'),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue('--line').trim();ctx.beginPath();ctx.moveTo(30,10);ctx.lineTo(30,h-25);ctx.lineTo(w-10,h-25);ctx.stroke();if(!a.length)return;let vals=a.map(x=>x.kg),min=Math.min(...vals)-1,max=Math.max(...vals)+1;ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue('--accent').trim();ctx.lineWidth=3;ctx.beginPath();a.forEach((x,i)=>{let px=30+(w-45)*(a.length===1?.5:i/(a.length-1)),py=10+(h-40)*(1-(x.kg-min)/(max-min));i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.stroke();ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--text').trim();ctx.font='14px sans-serif';ctx.fillText(max.toFixed(1)+' kg',36,20);ctx.fillText(min.toFixed(1)+' kg',36,h-31)}
function saveGoal(){let start=Number($('goalStart').value),target=Number($('goalTarget').value);if(!Number.isFinite(start)||!Number.isFinite(target)||start<20||start>400||target<20||target>400||start===target){alert('Enter different, realistic starting and target weights between 20 and 400 kg.');return}data.goal={start,target};save();recordRank();render();notifySystem('GOAL SAVED','Your weight goal is saved')}
function saveTrainingGoals(){data.trainingGoals={weekly:Number($('weeklyGoal').value),strength:Number($('strengthGoal').value)};save();recordRank();render();notifySystem('GOALS UPDATED','Training targets saved')}

function settings(){ $('view').innerHTML=`<h2>Preferences & routines</h2><div class="card"><h3>Personal settings</h3><p class="muted">Your name, goals and appearance are now in your Hunter Profile.</p><button onclick="go('profile')">Open Hunter Profile →</button></div><div class="card"><h3>Player progression</h3><p class="muted">Rank ${rankStatus().rank[0]} · Level ${levelInfo().level} · ${levelInfo().xp} XP. Rank milestones need XP and training progress. Weekly workout consistency contributes 60% and recorded strength improvements 40%. Earned ranks are permanent. +100 XP per full workout, +30 per walking day, +10 per weigh-in day.</p></div><p>Changes affect future workouts only. Your saved history stays intact.</p>${scheduleEditor()}<h3>Your workouts <small>(${Object.keys(data.routines).length}/5)</small></h3>${routineTabs('edit')}<div class="card"><label>Workout name<input maxlength="45" value="${esc(routineName(routine))}" onchange="renameRoutine(this.value)" aria-label="Workout name"></label><div class="row" style="margin-top:12px"><button onclick="addRoutine()" ${Object.keys(data.routines).length>=5?'disabled':''}>+ New workout</button><button onclick="removeRoutine()" ${Object.keys(data.routines).length<=1?'disabled':''}>Delete workout</button></div></div><div class="card">${data.routines[routine].map((e,i)=>`<div class="exercise"><label>Exercise name<input value="${esc(e[0])}" onchange="edit(${i},0,this.value)"></label><div class="settings-grid"><label>Sets<select onchange="edit(${i},1,this.value)">${numberSelect(e[1],1,10,1)}</select></label><label>Target reps<select onchange="edit(${i},2,this.value)">${targetOptions(e[2])}</select></label><label>Rest time<select onchange="edit(${i},3,this.value)">${restOptions(e[3]??60)}</select></label></div><div class="row" style="margin-top:8px"><button onclick="moveRoutineExercise(${i},-1)" ${i===0?'disabled':''}>↑ Up</button><button onclick="moveRoutineExercise(${i},1)" ${i===data.routines[routine].length-1?'disabled': let libraryFilter='All';
function openLibrary(){document.getElementById('libraryRoot').innerHTML=`<div class="library-overlay" role="dialog" aria-modal="true"><div class="library-panel"><div class="row"><h3 style="margin:0">Exercise library</h3><button onclick="closeLibrary()" aria-label="Close exercise library">✕</button></div><p class="muted">Browse exercises, see equipment and technique notes, then add one to your selected workout.</p><div class="library-controls"><input id="librarySearch" placeholder="Search exercises or equipment" oninput="filterLibrary()" aria-label="Search exercise library"><select id="libraryCategory" onchange="filterLibrary()" aria-label="Filter muscle group"><option>All</option>${[...new Set(EXERCISE_LIBRARY.map(e=>e[1]))].map(x=>`<option>${esc(x)}</option>`).join('')}</select><button onclick="closeLibrary()">Done</button></div><div id="libraryItems"></div></div></div>`;filterLibrary()}
function closeLibrary(){document.getElementById('libraryRoot').innerHTML=''}
function filterLibrary(){const q=(document.getElementById('librarySearch')?.value||'').toLowerCase(),cat=document.getElementById('libraryCategory')?.value||'All';const matches=EXERCISE_LIBRARY.map((e,i)=>({e,i})).filter(({e})=>(cat==='All'||e[1]===cat)&&e.slice(0,3).join(' ').toLowerCase().includes(q));document.getElementById('libraryItems').innerHTML=matches.map(({e,i})=>`<div class="library-item"><h4>${esc(e[0])}</h4><span class="library-tag">${esc(e[1])}</span><span class="library-tag">${esc(e[2])}</span><p>${esc(e[3])}</p><p><b>Tip:</b> ${esc(e[4])}</p><div class="library-actions"><button class="primary" onclick="addLibraryExercise(${i})">+ Add to workout</button></div></div>`).join('')||'<p class="muted">No exercises match your search.</p>'}
function addLibraryExercise(i){const e=EXERCISE_LIBRARY[i];if(!e||!data.routines[routine])return;data.routines[routine].push([e[0],e[5],e[6],60]);save();draft=null;saveDraft();closeLibrary();render();notifySystem('EXERCISE ADDED',e[0])}
function showExerciseInfo(){const name=data.routines[routine]?.[exerciseIndex]?.[0],e=EXERCISE_LIBRARY.find(x=>x[0].toLowerCase()===String(name).toLowerCase());if(!e)return;alert(e[0]+'\n\n'+e[1]+' · '+e[2]+'\n\n'+e[3]+'\n\nTip: '+e[4])}
function edit(i,j,v){data.routines[routine][i][j]=j===1?Math.max(1,Math.min(10,Number(v)||1)):j===3?Math.max(0,Number(v)||0):v;save();draft=null;saveDraft()}function removeExercise(i){if(!confirm('Remove exercise from this routine?'))return;data.routines[routine].splice(i,1);save();draft=null;saveDraft();render()}function addExercise(){data.routines[routine].push(['New exercise',3,'10–15',60]);save();draft=null;saveDraft();render()}function backup(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='reptrack-backup-'+date()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importBackup(f){if(!f)return;try{let v=JSON.parse(await f.text());if(!v||typeof v!=='object'||!v.routines||typeof v.routines!=='object'||!Object.keys(v.routines).length||Object.keys(v.routines).length>5||!Object.values(v.routines).every(a=>Array.isArray(a)&&a.every(e=>Array.isArray(e)&&typeof e[0]==='string'&&Number.isInteger(Number(e[1]))&&Number(e[1])>=1&&Number(e[1])<=10))||!Array.isArray(v.sessions)||!v.sessions.every(x=>Array.isArray(x.sets))||!Array.isArray(v.weights)||!Array.isArray(v.walks))throw Error();if(!confirm('Replace all current data with this backup?'))return;data=v;data.routineNames ||= {A:'Full Body A',B:'Full Body B'};routine=Object.keys(data.routines)[0];exerciseIndex=0;if(!save())return;clearRest();draft=null;saveDraft();render()}catch{alert('Invalid RepTrack backup file.')}}render();
</script></body></html>
